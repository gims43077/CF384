<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CF384 로컬 API 테스트</title>
<style>body{font:16px/1.65 system-ui,sans-serif;background:#eef3f7;color:#17334b;margin:0}main{max-width:900px;margin:40px auto;padding:28px;background:white;border-radius:16px}h1{font-size:28px;margin-top:0}label{display:block;font-weight:600;margin-top:18px}input,select,button{font:inherit;padding:10px;border:1px solid #b7c8d5;border-radius:8px}input[type=password]{width:calc(100% - 24px)}button{background:#087e8b;color:white;border:0;margin:20px 0;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;background:#f0f5f8;border-radius:10px;font-size:13px}img{display:block;max-width:100%;max-height:360px;margin:16px 0}.notice{color:#536879;font-size:14px}#status{font-weight:600}a{color:#087e8b}</style></head>
<body><main><h1>CF384 로컬 이미지 분석</h1><p>이 화면은 Python API 연결 테스트용입니다. 크롬 확장 프로그램은 포함하지 않습니다.</p>
<p class="notice">이미지는 현재 API 서버로 전송됩니다. 서버가 내 노트북에서 실행 중이면 외부 추론 서비스로 전송되지 않습니다. 결과는 진위 확정이나 보정된 확률이 아닙니다.</p>
<form id="form"><label for="key">API 키</label><input id="key" type="password" autocomplete="off" required placeholder="python client.py --show-key 명령의 값을 붙여 넣으세요">
<label for="file">이미지 한 장 (최대10MiB / 40MP)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/tiff,image/bmp" required>
<label for="model">대표 결과</label><select id="model"><option value="lowres" selected>L2-SP + 증강 + 160~300px 학습 (기본)</option><option value="adapted">기존 L2-SP + 증강 (비교용)</option><option value="original">원본 CF384</option></select><br><button id="submit" type="submit">로컬 서버로 분석</button></form>
<div id="status" role="status"></div><img id="preview" alt="선택한 이미지 미리보기" hidden><pre id="result" hidden></pre>
<p class="notice">AI 점수는 높을수록 생성 이미지 쪽입니다. label의 real/ai_generated는 모델 추정입니다. 원본과 개선 후보 점수를 함께 확인하세요.</p><a href="/docs">API 문서</a> · <a href="/health">서버 상태</a></main>
<script>
let objectUrl;
document.querySelector('#form').addEventListener('submit',async event=>{
 event.preventDefault();const button=document.querySelector('#submit'),status=document.querySelector('#status'),output=document.querySelector('#result'),file=document.querySelector('#file').files[0];
 button.disabled=true;status.textContent='분석 중…';output.hidden=true;
 try{if(!file)throw new Error('이미지를 선택하세요.');const data=new FormData();data.append('file',file);
 const response=await fetch('/v1/predict?model='+document.querySelector('#model').value,{method:'POST',headers:{'X-API-Key':document.querySelector('#key').value.trim()},body:data});
 const payload=await response.json();output.textContent=JSON.stringify(payload,null,2);output.hidden=false;
 if(!response.ok)throw new Error(payload.error?.message||'HTTP '+response.status);
 status.textContent=(payload.result.label==='ai_generated'?'AI 생성 추정':'실제 촬영 추정')+' / AI 점수 '+payload.result.score_ai.toFixed(4)+(payload.cached?' / 캐시':'');
 if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);const preview=document.querySelector('#preview');preview.src=objectUrl;preview.hidden=false;
 }catch(error){status.textContent='오류: '+error.message;}finally{button.disabled=false;}
});
</script></body></html>
